name: Samsung Electronics DART Financial Data Update & Deploy
on:
  schedule:
    - cron: '0 0 1 * *' # 09:00 KST on the 1st day of each month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'config/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'docs/**'
      - 'README.md'
      - 'API_KEY_SETUP.md'
permissions:
  contents: read
concurrency:
  group: samsung-dart-financial-dashboard-v2
  cancel-in-progress: true
jobs:
  refresh-data:
    name: Fetch DART, analyze ratios, and rebuild dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile scripts/fetch_dart.py scripts/analyze.py scripts/build_dashboard.py scripts/validate_project.py
      - name: Test DART extraction helpers
        run: python scripts/fetch_dart.py --self-test
      - name: Test ratio calculations
        run: python scripts/analyze.py --self-test
      - name: Fetch annual, half-year, and quarterly DART reports
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_dart.py
      - name: Calculate financial ratios and derive standalone quarters
        run: python scripts/analyze.py
      - name: Build dashboard and data JSON
        run: python scripts/build_dashboard.py
      - name: Validate dashboard data and JavaScript
        run: |
          python scripts/validate_project.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found in dashboard.")
          Path("/tmp/samsung-dashboard.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/samsung-dashboard.js
      - name: Commit refreshed data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "Update Samsung Electronics DART financial data"
            git push origin HEAD:main
          else
            echo "No generated data changes."
          fi
  deploy-pages:
    name: Deploy dashboard even if DART refresh fails
    needs: refresh-data
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  package-agent:
    name: Build clean downloadable ZIP package
    needs: refresh-data
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Stage source files without hidden paths
        run: |
          mkdir -p dist/Samsung_Electronics_DART_Agent/workflow_template
          mkdir -p dist/Samsung_Electronics_DART_Agent/config dist/Samsung_Electronics_DART_Agent/scripts dist/Samsung_Electronics_DART_Agent/data dist/Samsung_Electronics_DART_Agent/docs
          cp README.md API_KEY_SETUP.md env.example requirements.txt dist/Samsung_Electronics_DART_Agent/
          cp config/companies.json dist/Samsung_Electronics_DART_Agent/config/companies.json
          cp scripts/fetch_dart.py scripts/analyze.py scripts/build_dashboard.py scripts/validate_project.py dist/Samsung_Electronics_DART_Agent/scripts/
          cp data/dart_financials.json data/financial_data.json dist/Samsung_Electronics_DART_Agent/data/
          cp docs/index.html docs/data.json dist/Samsung_Electronics_DART_Agent/docs/
          cp .github/workflows/update.yml dist/Samsung_Electronics_DART_Agent/workflow_template/update.yml
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import zipfile
          root = Path("dist/Samsung_Electronics_DART_Agent")
          target = Path("dist/Samsung_Electronics_DART_Agent.zip")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          if not files:
              raise SystemExit("Agent package is empty.")
          hidden = [str(p.relative_to(root)) for p in files if any(part.startswith(".") for part in p.relative_to(root).parts)]
          if hidden:
              raise SystemExit("Hidden files must not be present in ZIP: " + ", ".join(hidden))
          with ZipFile(target, "w", ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, ("Samsung_Electronics_DART_Agent/" + str(p.relative_to(root))).replace("\\\\", "/"))
          with ZipFile(target) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("ZIP integrity check failed: " + bad)
              names = z.namelist()
              if any(any(part.startswith(".") for part in Path(n).parts) for n in names):
                  raise SystemExit("Hidden path detected in finished ZIP.")
          print(f"Built {target} with {len(files)} files; hidden-path check PASS; bytes={target.stat().st_size}")
          PY
      - name: Publish ZIP in repository downloads folder
        run: |
          mkdir -p downloads
          cp dist/Samsung_Electronics_DART_Agent.zip downloads/Samsung_Electronics_DART_Agent.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Samsung_Electronics_DART_Agent.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish downloadable Samsung Electronics DART agent ZIP"
            git push origin HEAD:main
          else
            echo "Agent ZIP already current."
          fi
      - name: Upload clean agent ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Samsung_Electronics_DART_Agent
          path: dist/Samsung_Electronics_DART_Agent.zip
          if-no-files-found: error
          retention-days: 30
